services:
  postgres:
    build:
      context: ./docker/postgres
      args:
        PGVECTOR_VERSION: "0.8.1"
    environment:
      POSTGRES_DB: nevis
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["${NEVIS_DATABASE_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    platform: linux/amd64
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--revision", "5c38ec7"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: [tei-data:/data]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    platform: linux/amd64
    command:
      ["--model-id", "cross-encoder/ms-marco-MiniLM-L6-v2", "--revision", "c5ee24c"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes: [reranker-data:/data]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &nevis-env
      NEVIS_ENVIRONMENT: local
      NEVIS_IDENTITY_PROVIDER: local-header
      NEVIS_DATABASE_URL: postgresql+asyncpg://nevis:nevis@postgres:5432/nevis
      NEVIS_TEI_BASE_URL: http://tei:80
      NEVIS_RERANKER_BASE_URL: http://reranker:80
      NEVIS_DOCUMENT_SUMMARIES_ENABLED: ${NEVIS_DOCUMENT_SUMMARIES_ENABLED:-false}
      NEVIS_FICTIONAL_TEST_DATA: ${NEVIS_FICTIONAL_TEST_DATA:-false}
      NEVIS_LLM_PROVIDER: ${NEVIS_LLM_PROVIDER:-opencode-go}
      NEVIS_LLM_MODEL: ${NEVIS_LLM_MODEL:-mimo-v2.5}
      NEVIS_LLM_ENDPOINT: ${NEVIS_LLM_ENDPOINT:-https://opencode.ai/zen/go/v1/chat/completions}
      NEVIS_DOCUMENT_SUMMARY_PROVIDER_MAX_TOKENS: ${NEVIS_DOCUMENT_SUMMARY_PROVIDER_MAX_TOKENS:-500}
      NEVIS_SUMMARY_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${NEVIS_SUMMARY_WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
      NEVIS_SUMMARY_WORKER_HEARTBEAT_FRESHNESS_SECONDS: ${NEVIS_SUMMARY_WORKER_HEARTBEAT_FRESHNESS_SECONDS:-20}
      NEVIS_LLM_API_KEY: ${NEVIS_LLM_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    environment: *nevis-env
    ports: ["${NEVIS_API_PORT:-8001}:8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      migrate: {condition: service_completed_successfully}
      tei: {condition: service_healthy}

  worker:
    build: .
    command: ["nevis-worker"]
    environment: *nevis-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      tei: {condition: service_healthy}

volumes:
  postgres-data:
  tei-data:
  reranker-data:
