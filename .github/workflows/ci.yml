name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm test:coverage && pnpm build
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.6.14
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/export_openapi.py
      - run: cd web && pnpm generate:api
      - run: git diff --exit-code -- openapi.json web/src/api.generated.ts
      - run: pnpm dlx @fission-ai/openspec@1.9.0 validate --all --strict
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pip-audit --local --skip-editable --progress-spinner off
      - run: uv run coverage erase
      - run: uv run pytest --cov=nevis --cov-report= --cov-fail-under=0 --ignore=tests/integration
      - run: docker compose -p nevis-migration-contract up --build --wait postgres
      - run: docker compose -p nevis-migration-contract run --rm migrate alembic upgrade head
      - run: docker compose -p nevis-migration-contract run --rm migrate alembic downgrade base
      - run: docker compose -p nevis-migration-contract run --rm migrate alembic upgrade head
      - run: docker compose -p nevis-migration-contract exec -T postgres psql -U nevis -d nevis -tAc "SELECT count(*) FROM tenants WHERE slug = 'nevis-global'" | grep '^1$'
      - run: docker compose -p nevis-migration-contract run --rm migrate python scripts/verify_search_migration.py
      - run: NEVIS_TEST_DATABASE_URL=postgresql+asyncpg://nevis:nevis@localhost:5434/nevis docker compose -f compose.yaml -f compose.test.yaml -p nevis-integration up --build --wait postgres migrate
      - run: NEVIS_TEST_DATABASE_URL=postgresql+asyncpg://nevis:nevis@localhost:5434/nevis uv run pytest --cov=nevis --cov-append --cov-report= --cov-fail-under=0 tests/integration
      - run: uv run coverage report
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -p nevis-integration down -v
      - if: always()
        run: docker compose -p nevis-migration-contract down -v
      - run: docker compose up --build --wait
      - run: docker compose exec -T api alembic check
      - run: docker compose exec -T api python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200"
      - run: docker compose exec -T api python scripts/verify_foundation.py
      - run: docker compose exec -T api python scripts/provision_advisor.py compose-smoke-advisor
      - run: docker compose exec -T api python scripts/provision_advisor.py local-advisor
      - run: docker compose exec -T api python scripts/verify_ingestion.py
      - run: docker compose exec -T api python scripts/verify_search.py
      - run: docker compose exec -T -e NEVIS_SEED_URL=http://127.0.0.1:8000 api python scripts/seed_preview.py
      - run: docker compose exec -T -e NEVIS_EVALUATION_URL=http://127.0.0.1:8000 api python scripts/evaluate_mixed_search.py
      - run: docker compose exec -T api python scripts/benchmark_search.py
      - if: always()
        run: docker compose down -v
